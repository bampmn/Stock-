function validDate(d,optional=false){
  if(optional&&d==="")return true;
  return typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&
    Number.isFinite(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;
}
function safeURL(v){
  if(!v)return "";
  const u=new URL(v);
  if(!["http:","https:"].includes(u.protocol))throw Error(tr("Use an http:// or https:// URL."));
  return u.href;
}
function validate(s){
  if(!s||typeof s!=="object")throw Error(tr("Invalid backup."));
  if(s.tasks===undefined)s.tasks=[];
  if(s.models===undefined)s.models=initialModels();
  if(s.components===undefined)s.components=[];
  if(!Array.isArray(s.models)||!Array.isArray(s.components))throw Error(ui("ข้อมูลสินค้าหลักไม่ถูกต้อง","Invalid main product data"));
  const modelIds=new Set(),componentKeys=new Set();
  for(const m of s.models){
   if(!m||typeof m.id!=="string"||!m.id||modelIds.has(m.id)||typeof m.name!=="string"||!m.name.trim()||typeof m.note!=="string")throw Error(ui("ข้อมูลสินค้าหลักไม่ถูกต้อง","Invalid main product"));
   modelIds.add(m.id);
  }
  for(const c of s.components){
   const key=c.modelId+"/"+c.productId;
   if(!modelIds.has(c.modelId)||!Array.isArray(s.products)||!s.products.some(p=>p.id===c.productId)||componentKeys.has(key)||!Number.isFinite(c.qty)||c.qty<=0||c.qty>1e9||typeof c.note!=="string")throw Error(ui("รายการอะไหล่ไม่ถูกต้อง","Invalid component"));
   componentKeys.add(key);
  }
  for(const key of ["products","suppliers","orders","lots","usages","tasks"]){
    if(!Array.isArray(s[key]))throw Error("Missing table: "+key);
    const ids=new Set();
    for(const row of s[key]){
      if(!row||typeof row.id!=="string"||!row.id||ids.has(row.id))throw Error("Invalid or duplicate ID in "+key);
      ids.add(row.id);
    }
  }
  const text=v=>typeof v==="string"&&v.length<=10000;
  const value=(v,positive=false)=>typeof v==="number"&&Number.isFinite(v)&&(positive?v>0:v>=0)&&v<=1e12;
  const ps=new Set(s.products.map(p=>p.id)),ss=new Set(s.suppliers.map(x=>x.id));
  const os=new Set(s.orders.map(o=>o.id)),ls=new Map(s.lots.map(l=>[l.id,l]));
  for(const p of s.products)
    if(!text(p.name)||!p.name.trim()||!text(p.variant)||!text(p.unit)||!p.unit.trim()||!text(p.location))
      throw Error(tr("Invalid product."));
  for(const x of s.suppliers){
    if(!text(x.name)||!x.name.trim()||!text(x.url))throw Error(tr("Invalid supplier."));
    safeURL(x.url);
  }
  for(const o of s.orders){
    if(!ss.has(o.supplierId)||!validDate(o.date,true)||!value(o.total)||!text(o.source)||!text(o.dateType)||!text(o.url))
      throw Error(tr("Invalid order."));
    safeURL(o.url);
  }
  for(const l of s.lots)
    if(!ps.has(l.productId)||!os.has(l.orderId)||!value(l.qty,true)||!value(l.cost)||
       typeof l.estimated!=="boolean"||(l.pending!==undefined&&typeof l.pending!=="boolean"))
      throw Error(tr("Invalid lot."));
  const used=new Map();
  for(const u of s.usages){
    if(!ls.has(u.lotId)||!value(u.qty,true)||!validDate(u.date)||!text(u.person)||!text(u.note))
      throw Error(tr("Invalid usage record."));
    used.set(u.lotId,(used.get(u.lotId)||0)+u.qty);
  }
  for(const [id,q] of used)
    if(ls.get(id).pending||q>ls.get(id).qty+1e-8)throw Error(tr("Usage exceeds available stock."));
  for(const t of s.tasks)
    if(!text(t.title)||!t.title.trim()||!text(t.description)||!text(t.assignee)||
       !stages.includes(t.status)||!["Low","Medium","High"].includes(t.priority)||
       !validDate(t.due,true)||!text(t.productId)||(t.productId&&!ps.has(t.productId)))
      throw Error(tr("Invalid workflow task."));
  return s;
}

const product=id=>state.products.find(p=>p.id===id);
const supplier=id=>state.suppliers.find(s=>s.id===id);
const order=id=>state.orders.find(o=>o.id===id);
const remaining=l=>l.pending?0:Math.max(0,Math.round((l.qty-state.usages.filter(u=>u.lotId===l.id).reduce((a,u)=>a+u.qty,0))*1e8)/1e8);
function stock(p){
  const lots=state.lots.filter(l=>l.productId===p.id);
  return {
    qty:lots.reduce((a,l)=>a+remaining(l),0),
    value:lots.reduce((a,l)=>a+remaining(l)*l.cost/l.qty,0),
    pending:lots.filter(l=>l.pending).reduce((a,l)=>a+l.qty,0)
  };
}

    const m=state.models.find(m=>m.id===id)||{};
    title=ui(id?"แก้ไขสินค้าหลัก":"เพิ่มสินค้าหลัก",id?"Edit main product":"Add main product");
    fields=input(ui("ชื่อสินค้าหลัก","Main product name"),"name",m.name||"","text",true,true)+input(ui("รายละเอียด","Description"),"note",m.note||"","text",false,true);
  }
  if(action==="component"){
    if(!state.products.length)return notify(ui("เพิ่มอะไหล่ในเมนูคลังสินค้าก่อน","Add a component in Inventory first."));
    const c=state.components.find(c=>c.modelId===selectedModel&&c.productId===id)||{};
    title=ui("อะไหล่ของสินค้า","Product component");
    const options=state.products.filter(p=>p.id===id||!state.components.some(c=>c.modelId===selectedModel&&c.productId===p.id));
    if(!options.length)return notify(ui("เพิ่มอะไหล่ในคลังครบแล้ว","All inventory items are already linked."));
    fields=select(ui("เลือกอะไหล่จากคลัง","Choose an inventory component"),"productId",options.map(p=>[p.id,p.name+" · "+p.variant]),id)+input(ui("จำนวนที่ใช้ต่อสินค้า 1 หน่วย","Quantity per main product unit"),"qty",c.qty||1,"number")+input(ui("หมายเหตุ","Notes"),"note",c.note||"","text",false,true);
  }
  if(action==="unlink"){
    title=ui("นำอะไหล่ออกจากสินค้า","Remove component from product");
    fields=`<p class="sm:col-span-2">${ui("นำรายการนี้ออกจากสินค้าหลักนี้เท่านั้น อะไหล่และสต็อกในคลังยังคงเดิม","Remove this link only. The inventory item and its stock will remain unchanged.")}</p>`;
  }
  if(action==="product"){
    const p=product(id)||{};
    title=id?tr("Edit product"):tr("Add product");
    fields=input(tr("Product name"),"name",p.name||"","text",true,true)+input(tr("Variant / model"),"variant",p.variant||"","text",false,true)+input(tr("Unit"),"unit",p.unit||"pcs")+input(tr("Storage location"),"location",p.location||"","text",false);
  }
  if(action==="supplier"){
    const s=supplier(id)||{};
    title=id?tr("Edit supplier"):tr("Add supplier");
    fields=input(tr("Supplier name"),"name",s.name||"","text",true,true)+input(tr("Shop URL"),"url",s.url||"","url",false,true);
  }
  if(action==="receive"){
    if(!state.products.length||!state.suppliers.length)return notify(tr("Add a product and supplier first."));
    title=tr("Purchase / receive stock");
    fields=select(tr("Product"),"productId",state.products.map(p=>[p.id,p.name+" · "+p.variant]),id)+
      select(tr("Supplier"),"supplierId",state.suppliers.map(s=>[s.id,s.name]))+
      select(tr("Status"),"status",[["received",tr("Received")],["pending",tr("Incoming / not received")]],"received")+
      input(tr("Record / receipt date"),"date",today(),"date")+input(tr("Quantity in product units"),"qty","","number")+
      input(tr("Net cost of the entire lot (THB)"),"cost","","number",true,true)+
      input(tr("Order reference / notes"),"source","","text",false,true)+input(tr("Product / order URL"),"url","","url",false,true)+
      `<p class="sm:col-span-2 muted">${esc(tr("Use the cost after discounts, including allocated shipping. Each purchase keeps its own cost."))}</p>`;
  }
  if(action==="use"){
    const available=state.lots.filter(l=>remaining(l)>0&&(!id||l.productId===id));
    if(!available.length)return notify(tr("No available stock to use."));
    title=tr("Record stock usage");
    fields=select(tr("Stock lot"),"lotId",available.map(l=>[l.id,`${product(l.productId).name} · ${l.id} · ${num(remaining(l))} ${tr("available")}`]),available.length===1?available[0].id:"")+
      input(tr("Quantity"),"qty","","number")+input(tr("Date"),"date",today(),"date")+
      input(tr("Used by"),"person","","text",true,true)+input(tr("Purpose / notes"),"note","","text",true,true);
  }
  if(action==="confirm"){
    title=tr("Receive the full lot");
    fields=input(tr("Actual receipt date"),"date",today(),"date",true,true)+
      `<p class="sm:col-span-2 muted">${esc(tr("Confirm only when the entire ordered quantity has arrived. This updates the existing lot without creating a duplicate purchase."))}</p>`;
  }
  if(action==="cost"){
    title=tr("Correct lot cost");
    fields=input(tr("Net total lot cost (THB)"),"cost",state.lots.find(l=>l.id===id).cost,"number",true,true)+
      `<p class="sm:col-span-2 muted">${esc(tr("This recalculates remaining stock value and historical usage cost for this lot. The original order total is unchanged."))}</p>`;
  }
  if(action==="task"){
    const t=state.tasks.find(t=>t.id===id)||{};
    title=id?tr("Edit workflow task"):tr("New workflow task");
    fields=input(tr("Task title"),"title",t.title||"","text",true,true)+
      `<label class="sm:col-span-2">${esc(tr("Description"))}<textarea name="description" rows="3" maxlength="10000">${esc(t.description||"")}</textarea></label>`+
      input(tr("Assignee"),"assignee",t.assignee||"","text",false)+input(tr("Due date"),"due",t.due||"","date",false)+
      select(tr("Stage"),"status",stages.map(s=>[s,tr(s)]),t.status||"Backlog")+
      select(tr("Priority"),"priority",["Low","Medium","High"].map(s=>[s,tr(s)]),t.priority||"Medium")+
      select(tr("Related product"),"productId",state.products.map(p=>[p.id,p.name+" · "+p.variant]),t.productId||"",false);
  }
  $("modalTitle").textContent=title;$("fields").innerHTML=fields;if(!$("modal").open)$("modal").showModal();
}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    const f=Object.fromEntries(new FormData(e.target)),next=copy(state);
    const amount=(name,positive=false)=>{
      const v=Number(f[name]);
      if(f[name]===""||!Number.isFinite(v)||(positive?v<=0:v<0)||v>1e9)throw Error(tr("Enter a valid quantity or cost."));
      return v;
    };
    if(mode==="model"){
      const m={id:editing||uid("M"),name:f.name.trim(),note:f.note.trim()};
      const i=next.models.findIndex(m=>m.id===editing);
      if(i>=0)next.models[i]=m;else next.models.push(m);
    }
    if(mode==="component"){
      next.components=next.components.filter(c=>!(c.modelId===selectedModel&&c.productId===editing));
      next.components.push({modelId:selectedModel,productId:f.productId,qty:amount("qty",true),note:f.note.trim()});
    }
    if(mode==="unlink")next.components=next.components.filter(c=>!(c.modelId===selectedModel&&c.productId===editing));
    if(mode==="product"){
      const p={id:editing||uid("P"),name:f.name.trim(),variant:f.variant.trim(),unit:f.unit.trim(),location:f.location.trim()};
      const i=next.products.findIndex(p=>p.id===editing);
      if(i>=0){
        if(next.lots.some(l=>l.productId===editing)&&p.unit!==next.products[i].unit)throw Error(tr("Cannot change units after purchasing stock."));
        next.products[i]=p;
      }else next.products.push(p);
    }
    if(mode==="supplier"){
      const s={id:editing||uid("S"),name:f.name.trim(),url:safeURL(f.url.trim())};
      const i=next.suppliers.findIndex(s=>s.id===editing);
      if(i>=0)next.suppliers[i]=s;else next.suppliers.push(s);
    }
    if(mode==="receive"){
      const id=uid("O"),cost=amount("cost"),pending=f.status==="pending";
      next.orders.push({id,date:f.date,dateType:pending?"Recorded / incoming":"Received",supplierId:f.supplierId,total:cost,source:f.source.trim()||"Manual entry",url:safeURL(f.url.trim())});
      next.lots.push({id:uid("L"),productId:f.productId,orderId:id,qty:amount("qty",true),cost,estimated:false,pending});
    }
    if(mode==="use"){
      const l=state.lots.find(l=>l.id===f.lotId),qty=amount("qty",true);
      if(!l||qty>remaining(l)+1e-8)throw Error(tr("Quantity exceeds available stock."));
      next.usages.push({id:uid("U"),lotId:l.id,qty,date:f.date,person:f.person.trim(),note:f.note.trim()});
    }
    if(mode==="confirm"){
      const l=next.lots.find(l=>l.id===editing);
      if(!l?.pending)throw Error(tr("This lot is not awaiting receipt."));
      l.pending=false;
      const o=next.orders.find(o=>o.id===l.orderId);
      o.date=f.date;o.dateType="Received";
    }
    if(mode==="cost"){
      const l=next.lots.find(l=>l.id===editing);
      l.cost=amount("cost");l.estimated=false;
    }
    if(mode==="task"){
      const old=next.tasks.find(t=>t.id===editing);
      const t={id:editing||uid("T"),title:f.title.trim(),description:f.description.trim(),assignee:f.assignee.trim(),
        due:f.due,status:f.status,priority:f.priority,productId:f.productId,
        createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
      const i=next.tasks.findIndex(t=>t.id===editing);
      if(i>=0)next.tasks[i]=t;else next.tasks.push(t);
    }
    await commit(next);$("modal").close();notify(tr("Saved successfully."));
  }catch(e){$("error").textContent=e.message;}
});

document.addEventListener("click",async e=>{
  const modelButton=e.target.closest("[data-model]");
  if(modelButton){selectedModel=modelButton.dataset.model;render();}
  const nav=e.target.closest("[data-view]");
  if(nav){view=nav.dataset.view;$("search").value="";render();}
  const action=e.target.closest("[data-action]");
  if(action)openForm(action.dataset.action,action.dataset.id||"");
  const move=e.target.closest("[data-move]");
  if(move){
    if(!canEdit)return notify(tr("This account has view-only access."));
    try{
      const next=copy(state),t=next.tasks.find(t=>t.id===move.dataset.move);
      if(!t)throw Error(tr("Task not found."));
      t.status=move.dataset.stage;t.updatedAt=new Date().toISOString();
      await commit(next);notify(tr("Moved to ")+tr(t.status));
    }catch(e){notify(e.message);}
  }
});
$("search").oninput=render;
$("close").onclick=$("cancel").onclick=()=>$("modal").close();

function download(name,text){
  const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("backup").onclick=()=>{
  if(blocked&&raw){download("management-os-recovery.json",raw);return;}
  download(`management-os-${today()}-r${revision}.json`,JSON.stringify({version:1,state,revision,savedAt},null,2));
  notify(tr("Backup downloaded."));
};
$("import").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    if(file.size>20*1024*1024)throw Error(tr("Maximum file size is 20 MB."));
    const doc=JSON.parse(await file.text());
    const next=validate(doc.state||doc);
    if(!confirm(lang==="th"?`แทนที่ข้อมูลปัจจุบันด้วยสินค้า ${next.products.length} รายการ คำสั่งซื้อ ${next.orders.length} รายการ และงาน ${next.tasks.length} รายการหรือไม่?\nกรุณาดาวน์โหลดสำรองข้อมูลปัจจุบันก่อน`:`Replace current data with ${next.products.length} products, ${next.orders.length} orders, and ${next.tasks.length} tasks?\nDownload a backup of your current data first.`))return;
    await commit(copy(next));notify(tr("Backup imported successfully."));
  }catch(e){notify(tr("Import failed: ")+e.message);}
  finally{$("file").value="";}
};
window.addEventListener("storage",e=>{
  if(e.key===KEY)notify(tr("Data changed in another tab. Refresh before making further changes."));
});
render();
startSession();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Management OS</title>
<meta name="app-version" content="public-view-2026-10-04">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f6f8fc;color:#172033}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid #dce2ec;border-radius:10px;background:white}
  label{display:block;font-size:13px;font-weight:600;color:#536078}
  label input,label select,label textarea{margin-top:7px;font-weight:400}
  button:disabled{opacity:.45;cursor:not-allowed}
  .primary{background:#2563eb;color:white;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600}
  .secondary{background:white;border:1px solid #dce2ec;padding:10px 14px;border-radius:10px;font-size:14px}
  .small{padding:6px 9px;font-size:12px;border:1px solid #dce2ec;border-radius:7px;background:white}
  .active{background:#edf3ff;color:#2563eb;font-weight:600}
  th,td{text-align:left;padding:15px;border-bottom:1px solid #edf0f6;vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8190a7;background:#fafbfe}
  td{font-size:13px}
  .muted{color:#8490a4;font-size:12px}
  .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;background:#edf3ff;color:#2563eb}
  dialog{padding:0;border:0;border-radius:18px;width:min(590px,94vw);max-height:90vh}
  dialog::backdrop{background:#111b3380;backdrop-filter:blur(3px)}
  :focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
</style>
</head>
<body>
<section hidden id="login" class="max-w-md mx-auto mt-20 bg-white border rounded-2xl p-8">
<h1 class="text-2xl font-bold mb-3">Management OS</h1><p class="text-sm text-slate-500 mb-5">Administrator sign-in. Everyone else can view without signing in.</p>
<button id="backToView" type="button" class="small mb-4">Continue viewing</button><form id="loginForm"><label>Email<input id="email" type="email" required value="bamnrllll@gmail.com"></label><button id="sendLink" class="primary mt-4" type="submit">Send sign-in link</button></form><p id="loginMessage" role="status" class="mt-4 text-sm"></p></section>
<div id="workspace" hidden><div class="min-h-screen lg:flex">
  <aside class="bg-white border-r border-slate-200 p-5 lg:w-60 lg:fixed lg:inset-y-0 lg:overflow-auto">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xl">▦</div>
      <div><div class="font-bold">Management OS</div><div class="muted">Your operations workspace</div></div>
    </div>
    <p class="text-[10px] tracking-widest text-slate-400 mb-3">WORKSPACE</p>
    <nav id="nav" class="flex lg:flex-col gap-1 overflow-auto"></nav>
    <div class="mt-8 pt-5 border-t space-y-2">
      <button id="backup" class="secondary w-full">↓ Backup JSON</button>
      <button id="import" class="secondary w-full">↑ Import JSON</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
      <p class="text-xs text-slate-400 leading-relaxed pt-3">
        Inventory is saved to your online database after each successful save. Export backups regularly.
      </p>
    </div>
  </aside>

  <main class="lg:ml-60 flex-1 min-w-0">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center">
      <div class="text-sm text-slate-400">Workspace <span class="mx-2">/</span><span id="crumb" class="text-slate-600"></span></div>
      <div class="flex gap-2"><button id="refreshCloud" class="small">Refresh online data</button><span id="accessLabel" class="badge">View-only</span><button id="adminLogin" class="small">Administrator sign-in</button><button id="logout" class="small">Sign out</button></div>
    </header>
    <div class="p-5 md:p-8 max-w-[1600px] mx-auto">
      <div class="flex flex-wrap justify-between items-start gap-4 mb-7">
        <div>
          <p class="text-blue-600 text-xs font-semibold tracking-widest mb-2">CONTROL CENTER</p>
          <h1 id="title" class="text-3xl font-bold"></h1>
          <p id="subtitle" class="text-slate-500 text-sm mt-2"></p>
        </div>
        <div id="actions" class="flex flex-wrap gap-2"></div>
      </div>
      <div id="stats" class="grid grid-cols-2 xl:grid-cols-4 gap-4 mb-7"></div>
      <div class="flex flex-wrap items-center justify-between mb-4 gap-3">
        <h2 id="sectionTitle" class="font-semibold"></h2>
        <input id="search" class="sm:max-w-xs" placeholder="Search this view…" aria-label="Search">
      </div>
      <div id="content"></div>
      <p id="saved" class="muted mt-5"></p>
    </div>
  </main>
</div>

</div>
<dialog id="modal">
  <form id="form" class="p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 id="modalTitle" class="text-xl font-bold"></h2>
      <button id="close" type="button" class="text-2xl text-slate-400" aria-label="Close">×</button>
    </div>
    <div id="fields" class="grid sm:grid-cols-2 gap-4"></div>
    <p id="error" class="text-red-600 text-sm mt-4" role="alert"></p>
    <div class="flex justify-end gap-2 mt-6 pt-4 border-t">
      <button id="cancel" type="button" class="secondary">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" class="hidden fixed bottom-5 left-5 right-5 sm:left-auto sm:max-w-md bg-slate-900 text-white rounded-xl p-4 shadow-xl z-50"></div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const KEY="management-os-workflows-v1";
const PREVIOUS=KEY+"-previous";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const copy=v=>JSON.parse(JSON.stringify(v));
const money=v=>new Intl.NumberFormat("th-TH",{style:"currency",currency:"THB"}).format(v);
const num=v=>new Intl.NumberFormat("en",{maximumFractionDigits:4}).format(v);
const today=()=>{
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const uid=p=>p+"-"+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2));
const fmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString():"Unknown date";
const empty=()=>({products:[],suppliers:[],orders:[],lots:[],usages:[],tasks:[]});
const stages=["Backlog","In progress","Review","Done"];
const views={
  overview:["Overview","A clear view of your stock and work."],
  inventory:["Inventory","Know what is available, incoming, and ready to use."],
  purchases:["Purchases","Track each purchase lot and its actual cost."],
  usage:["Usage","Record where your inventory goes."],
  suppliers:["Suppliers","Keep your purchasing contacts in one place."],
  workflows:["Workflows","Plan, assign, and move work through your process."]
};

let state=empty(),view="overview",revision=0,savedAt="",raw=null;
let mode="",editing="",timer,blocked=false;

function notify(message){
  $("toast").textContent=message;
  $("toast").classList.remove("hidden");
  clearTimeout(timer);
  timer=setTimeout(()=>$("toast").classList.add("hidden"),6500);
}
function validDate(d,optional=false){
  if(optional&&d==="")return true;
  return typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&
    Number.isFinite(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;
}
function safeURL(v){
  if(!v)return "";
  const u=new URL(v);
  if(!["http:","https:"].includes(u.protocol))throw Error("Use an http:// or https:// URL.");
  return u.href;
}
function validate(s){
  if(!s||typeof s!=="object")throw Error("Invalid backup.");
  if(s.tasks===undefined)s.tasks=[];
  for(const key of ["products","suppliers","orders","lots","usages","tasks"]){
    if(!Array.isArray(s[key]))throw Error("Missing table: "+key);
    const ids=new Set();
    for(const row of s[key]){
      if(!row||typeof row.id!=="string"||!row.id||ids.has(row.id))throw Error("Invalid or duplicate ID in "+key);
      ids.add(row.id);
    }
  }
  const text=v=>typeof v==="string"&&v.length<=10000;
  const value=(v,positive=false)=>typeof v==="number"&&Number.isFinite(v)&&(positive?v>0:v>=0)&&v<=1e12;
  const ps=new Set(s.products.map(p=>p.id)),ss=new Set(s.suppliers.map(x=>x.id));
  const os=new Set(s.orders.map(o=>o.id)),ls=new Map(s.lots.map(l=>[l.id,l]));
  for(const p of s.products)
    if(!text(p.name)||!p.name.trim()||!text(p.variant)||!text(p.unit)||!p.unit.trim()||!text(p.location))
      throw Error("Invalid product.");
  for(const x of s.suppliers){
    if(!text(x.name)||!x.name.trim()||!text(x.url))throw Error("Invalid supplier.");
    safeURL(x.url);
  }
  for(const o of s.orders){
    if(!ss.has(o.supplierId)||!validDate(o.date,true)||!value(o.total)||!text(o.source)||!text(o.dateType)||!text(o.url))
      throw Error("Invalid order.");
    safeURL(o.url);
  }
  for(const l of s.lots)
    if(!ps.has(l.productId)||!os.has(l.orderId)||!value(l.qty,true)||!value(l.cost)||
       typeof l.estimated!=="boolean"||(l.pending!==undefined&&typeof l.pending!=="boolean"))
      throw Error("Invalid lot.");
  const used=new Map();
  for(const u of s.usages){
    if(!ls.has(u.lotId)||!value(u.qty,true)||!validDate(u.date)||!text(u.person)||!text(u.note))
      throw Error("Invalid usage record.");
    used.set(u.lotId,(used.get(u.lotId)||0)+u.qty);
  }
  for(const [id,q] of used)
    if(ls.get(id).pending||q>ls.get(id).qty+1e-8)throw Error("Usage exceeds available stock.");
  for(const t of s.tasks)
    if(!text(t.title)||!t.title.trim()||!text(t.description)||!text(t.assignee)||
       !stages.includes(t.status)||!["Low","Medium","High"].includes(t.priority)||
       !validDate(t.due,true)||!text(t.productId)||(t.productId&&!ps.has(t.productId)))
      throw Error("Invalid workflow task.");
  return s;
}
const OWNER="bamnrllll@gmail.com";

let canEdit=false;
const cloud=window.supabase.createClient("https://gukiufopxxmloypyiruw.supabase.co","sb_publishable_cXJIqcBya6HV5wNOi2BB3w_y5_pP_4K");
let authenticated=false,saving=false;
async function loadCloud(){
 const {data,error}=await cloud.from('management_inventory').select('*').eq('id','main').maybeSingle();
 if(error)throw Error('Online database is not ready: '+error.message);
 state=data?validate(data.payload):empty();revision=data?Number(data.revision):0;savedAt=data?.updated_at||'';render();
}
async function commit(next){
 if(!authenticated)throw Error('Please sign in first.');
 if(!canEdit)throw Error('This account has view-only access.');
 if(saving)throw Error('A save is already in progress. Please wait.');
 validate(next);saving=true;
 try{
 const {data,error}=await cloud.rpc('save_management_inventory',{expected_revision:revision,new_payload:next});
 if(error)throw Error(error.message+' Your form is still open. Refresh online data if another device changed it.');
 if(!data?.[0])throw Error('No save confirmation received.');
 state=validate(data[0].payload);revision=Number(data[0].revision);savedAt=data[0].updated_at;render();
 }finally{saving=false;}
}
async function startSession(){
 canEdit=false;authenticated=false;
 try{
 const {data}=await cloud.auth.getUser();
 authenticated=!!data.user;canEdit=data.user?.email?.toLowerCase()===OWNER;
 await loadCloud();$('workspace').hidden=false;$('login').hidden=true;
 }catch(e){canEdit=false;render();$('workspace').hidden=false;$('login').hidden=true;notify(e.message);}
}
$('adminLogin').onclick=()=>{$('workspace').hidden=true;$('login').hidden=false;};
$('backToView').onclick=()=>{$('workspace').hidden=false;$('login').hidden=true;};
$('loginForm').onsubmit=async e=>{
 e.preventDefault();$('sendLink').disabled=true;
 try{
 const email=$('email').value.trim().toLowerCase();
 if(email!==OWNER)throw Error('Only the administrator needs to sign in. Use Continue viewing for read-only access.');
 const {error}=await cloud.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.origin+'/'}});
 if(error)throw error;$('loginMessage').textContent='Check your email and open the sign-in link. You can close this page.';
 }catch(e){$('loginMessage').textContent=e.message;}finally{$('sendLink').disabled=false;}
};
$('logout').onclick=async()=>{await cloud.auth.signOut();location.reload();};
$('refreshCloud').onclick=async()=>{if(saving)return;try{await loadCloud();notify('Online data refreshed.');}catch(e){notify(e.message)}};
cloud.auth.onAuthStateChange((event)=>{
 if(event==='SIGNED_OUT'){authenticated=false;canEdit=false;state=empty();revision=0;$('modal').close();render();$('workspace').hidden=false;$('login').hidden=true;setTimeout(startSession,0);}
 if(event==='SIGNED_IN')setTimeout(startSession,0);
});
const product=id=>state.products.find(p=>p.id===id);
const supplier=id=>state.suppliers.find(s=>s.id===id);
const order=id=>state.orders.find(o=>o.id===id);
const remaining=l=>l.pending?0:Math.max(0,Math.round((l.qty-state.usages.filter(u=>u.lotId===l.id).reduce((a,u)=>a+u.qty,0))*1e8)/1e8);
function stock(p){
  const lots=state.lots.filter(l=>l.productId===p.id);
  return {
    qty:lots.reduce((a,l)=>a+remaining(l),0),
    value:lots.reduce((a,l)=>a+remaining(l)*l.cost/l.qty,0),
    pending:lots.filter(l=>l.pending).reduce((a,l)=>a+l.qty,0)
  };
}
const btn=(a,id,label,cls="small")=>`<button class="${cls}" data-action="${a}" data-id="${esc(id)}">${esc(label)}</button>`;
const link=url=>url?`<a class="text-blue-600" href="${esc(safeURL(url))}" target="_blank" rel="noopener noreferrer">Open ↗</a>`:"—";
const table=(headers,rows)=>`<div class="bg-white border rounded-2xl overflow-auto"><table class="w-full"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${headers.length}" class="text-center py-16 text-slate-400">No records yet. Add an item or import your backup.</td></tr>`}</tbody></table></div>`;

function render(){
 $('accessLabel').textContent=canEdit?'Administrator':'View-only';
 $('adminLogin').hidden=canEdit;$('logout').hidden=!authenticated;

  $("title").textContent=views[view][0];
  $("crumb").textContent=views[view][0];
  $("subtitle").textContent=views[view][1];
  $("sectionTitle").textContent=view==="overview"?"Workspace summary":views[view][0];
  $("search").classList.toggle("hidden",view==="overview");
  $("nav").innerHTML=Object.entries(views).map(([id,[title]])=>
    `<button data-view="${id}" class="rounded-xl px-4 py-3 text-sm text-left whitespace-nowrap ${view===id?"active":"text-slate-500"}">${esc(title)}</button>`).join("");
  $("actions").innerHTML=view==="workflows"?btn("task","","＋ New task","primary"):
    view==="suppliers"?btn("supplier","","＋ Add supplier","primary"):
    view==="usage"?btn("use","","＋ Record usage","primary"):
    btn("product","","＋ Add product","secondary")+" "+btn("receive","","＋ Purchase / receive","primary");

  const value=state.products.reduce((a,p)=>a+stock(p).value,0);
  const stats=[
    ["PRODUCTS",num(state.products.length),"Distinct products and variants"],
    ["STOCK VALUE",money(value),"Received stock still available"],
    ["INCOMING LOTS",num(state.lots.filter(l=>l.pending).length),"Not included in available stock"],
    ["OPEN TASKS",num(state.tasks.filter(t=>t.status!=="Done").length),"Across your workflow"]
  ];
  $("stats").innerHTML=stats.map(([a,b,c])=>`<div class="bg-white border rounded-2xl p-5"><p class="text-[10px] tracking-widest text-slate-400">${a}</p><p class="text-2xl font-bold mt-3">${b}</p><p class="muted mt-2">${c}</p></div>`).join("");
  const q=$("search").value.toLowerCase().trim(),match=(...v)=>v.join(" ").toLowerCase().includes(q);
  let rows=[];

  if(view==="overview"){
    const totals=stages.map(s=>[s,state.tasks.filter(t=>t.status===s).length]);
    const top=[...state.products].sort((a,b)=>stock(b).value-stock(a).value).slice(0,5);
    $("content").innerHTML=`
      <div class="grid xl:grid-cols-2 gap-5">
        <section class="bg-white border rounded-2xl p-6">
          <div class="flex justify-between mb-6"><h3 class="font-semibold">Workflow progress</h3><button data-view="workflows" class="text-sm text-blue-600">View board →</button></div>
          ${totals.map(([s,n])=>`<div class="mb-5"><div class="flex justify-between text-sm mb-2"><span>${s}</span><b>${n}</b></div><div class="h-2 rounded bg-slate-100"><div class="h-2 rounded bg-blue-500" style="width:${state.tasks.length?n/state.tasks.length*100:0}%"></div></div></div>`).join("")}
          <p class="muted">Workflow tasks organize work. Stock changes only through purchase, receipt, and usage actions.</p>
        </section>
        <section class="bg-white border rounded-2xl p-6">
          <h3 class="font-semibold mb-5">Highest stock value</h3>
          ${top.length?top.map(p=>`<div class="flex justify-between gap-3 py-4 border-b"><div><b class="text-sm">${esc(p.name)}</b><p class="muted">${esc(p.variant)}</p></div><span class="text-sm font-semibold">${money(stock(p).value)}</span></div>`).join(""):'<p class="text-slate-400 text-sm py-10">Import your inventory backup or add your first product.</p>'}
        </section>
      </div>`;
  }
  if(view==="inventory"){
    rows=state.products.filter(p=>match(p.name,p.variant,p.id,p.location)).map(p=>{
      const s=stock(p);
      return `<tr><td><b>${esc(p.name)}</b><p class="muted mt-1">${esc(p.variant)} · ${esc(p.id)}</p></td><td>${esc(p.location)||"—"}</td>
        <td><b class="${s.qty?"text-emerald-600":"text-slate-400"}">${num(s.qty)}</b> ${esc(p.unit)}${s.pending?`<p class="text-amber-600 text-xs mt-1">${num(s.pending)} incoming</p>`:""}</td>
        <td>${money(s.value)}</td><td><div class="flex gap-2">${btn("product",p.id,"Edit")}${btn("receive",p.id,"Buy")}${btn("use",p.id,"Use")}</div></td></tr>`;
    });
    $("content").innerHTML=table(["Product","Location","Available","Value","Actions"],rows);
  }
  if(view==="purchases"){
    rows=[...state.lots].reverse().filter(l=>{
      const p=product(l.productId),o=order(l.orderId);
      return match(p.name,p.variant,l.id,o.id,o.source,supplier(o.supplierId).name);
    }).map(l=>{
      const p=product(l.productId),o=order(l.orderId);
      return `<tr><td><b>${esc(p.name)}</b><p class="muted">${esc(p.variant)} · ${esc(l.id)}</p><p class="muted mt-1">${esc(o.source)}</p></td>
        <td>${esc(supplier(o.supplierId).name)}<div class="mt-1">${link(o.url)}</div></td>
        <td>${fmt(o.date)}<p class="muted">${esc(o.dateType)}</p></td>
        <td><span class="badge">${l.pending?"Incoming":"Received"}</span><p class="mt-2">${num(l.qty)} ${esc(p.unit)}</p><p class="muted">${num(remaining(l))} available</p></td>
        <td>${money(l.cost/l.qty)}</td><td>${money(l.cost)}<p class="muted">${l.estimated?"Estimated":"Confirmed"}</p></td>
        <td><div class="flex gap-2">${l.pending?btn("confirm",l.id,"Receive all"):""}${btn("cost",l.id,"Edit cost")}</div></td></tr>`;
    });
    $("content").innerHTML=table(["Product / lot","Supplier","Date","Quantity","Unit cost","Lot cost","Actions"],rows);
  }
  if(view==="usage"){
    rows=[...state.usages].reverse().filter(u=>{
      const l=state.lots.find(l=>l.id===u.lotId);
      return match(product(l.productId).name,u.person,u.note);
    }).map(u=>{
      const l=state.lots.find(l=>l.id===u.lotId),p=product(l.productId);
      return `<tr><td>${fmt(u.date)}</td><td><b>${esc(p.name)}</b><p class="muted">${esc(p.variant)}</p></td><td>${num(u.qty)} ${esc(p.unit)}</td><td>${money(u.qty*l.cost/l.qty)}</td><td>${esc(u.person)}</td><td>${esc(u.note)}</td></tr>`;
    });
    $("content").innerHTML=table(["Date","Product","Quantity","Cost","Used by","Purpose"],rows);
  }
  if(view==="suppliers"){
    rows=state.suppliers.filter(s=>match(s.name,s.url)).map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${link(s.url)}</td><td>${state.orders.filter(o=>o.supplierId===s.id).length}</td><td>${btn("supplier",s.id,"Edit")}</td></tr>`);
    $("content").innerHTML=table(["Supplier","Link","Orders","Actions"],rows);
  }
  if(view==="workflows"){
    $("content").innerHTML=`<div class="grid md:grid-cols-2 2xl:grid-cols-4 gap-4">${stages.map((stage,index)=>{
      const tasks=state.tasks.filter(t=>t.status===stage&&match(t.title,t.description,t.assignee,product(t.productId)?.name));
      return `<section class="bg-slate-100/80 border rounded-2xl p-3 min-h-64">
        <div class="flex justify-between items-center p-2 mb-3"><h3 class="text-sm font-semibold">${stage}</h3><span class="text-xs bg-white border rounded px-2 py-1">${tasks.length}</span></div>
        <div class="space-y-3">${tasks.map(t=>{
          const overdue=t.due&&t.due<today()&&t.status!=="Done";
          const color=t.priority==="High"?"text-red-600 bg-red-50":t.priority==="Medium"?"text-amber-700 bg-amber-50":"text-blue-600 bg-blue-50";
          return `<article class="bg-white border rounded-xl p-4 shadow-sm">
            <div class="flex justify-between items-center mb-3"><span class="text-[10px] px-2 py-1 rounded ${color}">${esc(t.priority)} priority</span>${btn("task",t.id,"Edit")}</div>
            <h4 class="font-semibold text-sm break-words">${esc(t.title)}</h4>
            <p class="text-xs text-slate-500 mt-2 whitespace-pre-wrap break-words">${esc(t.description)}</p>
            ${t.productId?`<p class="badge mt-3">${esc(product(t.productId).name)}</p>`:""}
            <div class="flex flex-wrap justify-between gap-2 text-xs mt-4 pt-3 border-t"><span>${esc(t.assignee)||"Unassigned"}</span><span class="${overdue?"text-red-600":"text-slate-400"}">${t.due?fmt(t.due):"No due date"}${overdue?" · Overdue":""}</span></div>
            <div class="flex justify-between mt-3">
              ${index?`<button class="small" data-move="${esc(t.id)}" data-stage="${stages[index-1]}">← Back</button>`:"<span></span>"}
              ${index<3?`<button class="small text-blue-600" data-move="${esc(t.id)}" data-stage="${stages[index+1]}">Next →</button>`:'<span class="text-xs text-emerald-600">✓ Complete</span>'}
            </div>
          </article>`;
        }).join("")||'<p class="text-xs text-slate-400 text-center py-8">No tasks in this stage</p>'}</div>
      </section>`;
    }).join("")}</div>`;
  }
  document.querySelectorAll("[data-action],[data-move]").forEach(b=>b.hidden=!canEdit);
  $("import").hidden=!canEdit;
  $("saved").textContent=savedAt?`Last saved ${new Date(savedAt).toLocaleString()} · Revision ${revision}`:"No data saved yet.";
}

function input(label,name,value="",type="text",required=true,full=false){
  return `<label class="${full?"sm:col-span-2":""}">${esc(label)}<input name="${name}" value="${esc(value)}" type="${type}" ${required?"required":""} ${type==="number"?'min="0" step="any"':'maxlength="2000"'}></label>`;
}
function select(label,name,options,value="",required=true){
  return `<label class="sm:col-span-2">${esc(label)}<select name="${name}" ${required?"required":""}><option value="">${required?"Select…":"None"}</option>${options.map(([id,title])=>`<option value="${esc(id)}" ${id===value?"selected":""}>${esc(title)}</option>`).join("")}</select></label>`;
}
function openForm(action,id=""){
  if(!canEdit)return notify("This account has view-only access.");
  mode=action;editing=id;$("error").textContent="";
  let fields="",title="";
  if(action==="product"){
    const p=product(id)||{};
    title=id?"Edit product":"Add product";
    fields=input("Product name","name",p.name||"","text",true,true)+input("Variant / model","variant",p.variant||"","text",false,true)+input("Unit","unit",p.unit||"pcs")+input("Storage location","location",p.location||"","text",false);
  }
  if(action==="supplier"){
    const s=supplier(id)||{};
    title=id?"Edit supplier":"Add supplier";
    fields=input("Supplier name","name",s.name||"","text",true,true)+input("Shop URL","url",s.url||"","url",false,true);
  }
  if(action==="receive"){
    if(!state.products.length||!state.suppliers.length)return notify("Add a product and supplier first.");
    title="Purchase / receive stock";
    fields=select("Product","productId",state.products.map(p=>[p.id,p.name+" · "+p.variant]),id)+
      select("Supplier","supplierId",state.suppliers.map(s=>[s.id,s.name]))+
      select("Status","status",[["received","Received"],["pending","Incoming / not received"]],"received")+
      input("Record / receipt date","date",today(),"date")+input("Quantity in product units","qty","","number")+
      input("Net cost of the entire lot (THB)","cost","","number",true,true)+
      input("Order reference / notes","source","","text",false,true)+input("Product / order URL","url","","url",false,true)+
      '<p class="sm:col-span-2 muted">Use the cost after discounts, including allocated shipping. Each purchase keeps its own cost.</p>';
  }
  if(action==="use"){
    const available=state.lots.filter(l=>remaining(l)>0&&(!id||l.productId===id));
    if(!available.length)return notify("No available stock to use.");
    title="Record stock usage";
    fields=select("Stock lot","lotId",available.map(l=>[l.id,`${product(l.productId).name} · ${l.id} · ${num(remaining(l))} available`]),available.length===1?available[0].id:"")+
      input("Quantity","qty","","number")+input("Date","date",today(),"date")+
      input("Used by","person","","text",true,true)+input("Purpose / notes","note","","text",true,true);
  }
  if(action==="confirm"){
    title="Receive the full lot";
    fields=input("Actual receipt date","date",today(),"date",true,true)+
      '<p class="sm:col-span-2 muted">Confirm only when the entire ordered quantity has arrived. This updates the existing lot without creating a duplicate purchase.</p>';
  }
  if(action==="cost"){
    title="Correct lot cost";
    fields=input("Net total lot cost (THB)","cost",state.lots.find(l=>l.id===id).cost,"number",true,true)+
      '<p class="sm:col-span-2 muted">This recalculates remaining stock value and historical usage cost for this lot. The original order total is unchanged.</p>';
  }
  if(action==="task"){
    const t=state.tasks.find(t=>t.id===id)||{};
    title=id?"Edit workflow task":"New workflow task";
    fields=input("Task title","title",t.title||"","text",true,true)+
      `<label class="sm:col-span-2">Description<textarea name="description" rows="3" maxlength="10000">${esc(t.description||"")}</textarea></label>`+
      input("Assignee","assignee",t.assignee||"","text",false)+input("Due date","due",t.due||"","date",false)+
      select("Stage","status",stages.map(s=>[s,s]),t.status||"Backlog")+
      select("Priority","priority",["Low","Medium","High"].map(s=>[s,s]),t.priority||"Medium")+
      select("Related product","productId",state.products.map(p=>[p.id,p.name+" · "+p.variant]),t.productId||"",false);
  }
  $("modalTitle").textContent=title;$("fields").innerHTML=fields;$("modal").showModal();
}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    const f=Object.fromEntries(new FormData(e.target)),next=copy(state);
    const amount=(name,positive=false)=>{
      const v=Number(f[name]);
      if(f[name]===""||!Number.isFinite(v)||(positive?v<=0:v<0)||v>1e9)throw Error("Enter a valid quantity or cost.");
      return v;
    };
    if(mode==="product"){
      const p={id:editing||uid("P"),name:f.name.trim(),variant:f.variant.trim(),unit:f.unit.trim(),location:f.location.trim()};
      const i=next.products.findIndex(p=>p.id===editing);
      if(i>=0){
        if(next.lots.some(l=>l.productId===editing)&&p.unit!==next.products[i].unit)throw Error("Cannot change units after purchasing stock.");
        next.products[i]=p;
      }else next.products.push(p);
    }
    if(mode==="supplier"){
      const s={id:editing||uid("S"),name:f.name.trim(),url:safeURL(f.url.trim())};
      const i=next.suppliers.findIndex(s=>s.id===editing);
      if(i>=0)next.suppliers[i]=s;else next.suppliers.push(s);
    }
    if(mode==="receive"){
      const id=uid("O"),cost=amount("cost"),pending=f.status==="pending";
      next.orders.push({id,date:f.date,dateType:pending?"Recorded / incoming":"Received",supplierId:f.supplierId,total:cost,source:f.source.trim()||"Manual entry",url:safeURL(f.url.trim())});
      next.lots.push({id:uid("L"),productId:f.productId,orderId:id,qty:amount("qty",true),cost,estimated:false,pending});
    }
    if(mode==="use"){
      const l=state.lots.find(l=>l.id===f.lotId),qty=amount("qty",true);
      if(!l||qty>remaining(l)+1e-8)throw Error("Quantity exceeds available stock.");
      next.usages.push({id:uid("U"),lotId:l.id,qty,date:f.date,person:f.person.trim(),note:f.note.trim()});
    }
    if(mode==="confirm"){
      const l=next.lots.find(l=>l.id===editing);
      if(!l?.pending)throw Error("This lot is not awaiting receipt.");
      l.pending=false;
      const o=next.orders.find(o=>o.id===l.orderId);
      o.date=f.date;o.dateType="Received";
    }
    if(mode==="cost"){
      const l=next.lots.find(l=>l.id===editing);
      l.cost=amount("cost");l.estimated=false;
    }
    if(mode==="task"){
      const old=next.tasks.find(t=>t.id===editing);
      const t={id:editing||uid("T"),title:f.title.trim(),description:f.description.trim(),assignee:f.assignee.trim(),
        due:f.due,status:f.status,priority:f.priority,productId:f.productId,
        createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
      const i=next.tasks.findIndex(t=>t.id===editing);
      if(i>=0)next.tasks[i]=t;else next.tasks.push(t);
    }
    await commit(next);$("modal").close();notify("Saved successfully.");
  }catch(e){$("error").textContent=e.message;}
});

document.addEventListener("click",async e=>{
  const nav=e.target.closest("[data-view]");
  if(nav){view=nav.dataset.view;$("search").value="";render();}
  const action=e.target.closest("[data-action]");
  if(action)openForm(action.dataset.action,action.dataset.id||"");
  const move=e.target.closest("[data-move]");
  if(move){
    if(!canEdit)return notify("This account has view-only access.");
    try{
      const next=copy(state),t=next.tasks.find(t=>t.id===move.dataset.move);
      if(!t)throw Error("Task not found.");
      t.status=move.dataset.stage;t.updatedAt=new Date().toISOString();
      await commit(next);notify("Moved to "+t.status);
    }catch(e){notify(e.message);}
  }
});
$("search").oninput=render;
$("close").onclick=$("cancel").onclick=()=>$("modal").close();

function download(name,text){
  const url=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("backup").onclick=()=>{
  if(blocked&&raw){download("management-os-recovery.json",raw);return;}
  download(`management-os-${today()}-r${revision}.json`,JSON.stringify({version:1,state,revision,savedAt},null,2));
  notify("Backup downloaded.");
};
$("import").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    if(file.size>20*1024*1024)throw Error("Maximum file size is 20 MB.");
    const doc=JSON.parse(await file.text());
    const next=validate(doc.state||doc);
    if(!confirm(`Replace current data with ${next.products.length} products, ${next.orders.length} orders, and ${next.tasks.length} tasks?\nDownload a backup of your current data first.`))return;
    await commit(copy(next));notify("Backup imported successfully.");
  }catch(e){notify("Import failed: "+e.message);}
  finally{$("file").value="";}
};
window.addEventListener("storage",e=>{
  if(e.key===KEY)notify("Data changed in another tab. Refresh before making further changes.");
});
render();
startSession();
</script>
</body>
</html>
